name: build

on:
  push:
    tags: ["macos-v*"]     # macos 分支獨立發布；Windows／Linux 版由 main 的 v* 標籤發布
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 只支援 Apple Silicon（M 系列晶片）
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"     # 測試與腳本輸出含中文；GitHub 的 Windows 主機主控台預設是 cp1252
    steps:
      - uses: actions/checkout@v7

      - name: Linux 系統函式庫（Qt xcb 外掛所需，會一併打包）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libegl1 fonts-noto-cjk

      - name: 建立自帶環境並打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 外部程式（pytest、PyInstaller…）失敗時要讓步驟失敗；pwsh 預設只看步驟最後一個指令
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/setup.ps1
          ./scripts/test.ps1; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/build.ps1
          .venv/Scripts/python.exe tests/smoke_package.py dist/Divebird/Divebird.exe

      - name: 建立自帶環境並打包（Linux）
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./scripts/setup.sh
          ./scripts/test.sh
          ./scripts/build.sh
          .venv/bin/python tests/smoke_package.py dist/Divebird/Divebird

      - name: 建立自帶環境並打包（macOS）
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./scripts/setup.sh
          ./scripts/test.sh
          ./scripts/build.sh
          .venv/bin/python tests/smoke_package.py dist/Divebird.app/Contents/MacOS/Divebird

      - uses: actions/upload-artifact@v7
        with:
          name: Divebird-${{ runner.os }}
          if-no-files-found: error   # 打包沒有產出時讓 CI 失敗，不要只發警告
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg

  # 每次都產生校驗碼（檢查發佈流程）；推送 macos-v* 標籤時才真的發佈到 GitHub Releases
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: 產生 SHA256 校驗碼
        run: |
          cd artifacts
          ls -l
          test "$(ls *-macos-arm64.dmg | wc -l)" -eq 1
          sha256sum *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - if: startsWith(github.ref, 'refs/tags/macos-v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.dmg
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          # 不標成 Latest：Windows／Linux 版的「檢查更新」看的是 Latest
          make_latest: false
